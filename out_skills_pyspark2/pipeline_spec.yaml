name: pyspark2_daily_txn_risk
source_system: pyspark2
target_engine: pyspark_3.x
findings:
- id: F-001
  category: business_assumption
  severity: high
  confidence: high
  source_ref: 'T5 amount_usd: F.coalesce(F.col(''usd_rate''), F.lit(1.0))'
  evidence: A missing FX rate for a currency and date is silently treated as rate
    1.0 (USD parity). Preserved as written; not validated.
  affected_refs:
  - t05_amounts
  - tgt_customer_daily_risk
  blocks:
  - execution
  status: open
  resolution: Business owner to declare FX fallback policy (preserve, NULL, or reject)
    and required FX coverage. No silent change.
  rule_ref: null
- id: F-002
  category: compatibility
  severity: high
  confidence: high
  source_ref: 'T3: txn.filter(status == POSTED).dropDuplicates([''txn_id''])'
  evidence: Keeps one arbitrary row per txn_id with no ordering or tie-breaker. Conflicting
    duplicates (including equal txn_ts) produce a non-deterministic winner.
  affected_refs:
  - t03_posted_txn
  blocks:
  - generation
  - execution
  status: open
  resolution: Define a deterministic ordering (for example, a declared version or
    load column with a unique final tie-breaker) before deduplication, or reviewer-approved
    rule. Do not select arbitrarily.
  rule_ref: null
- id: F-003
  category: metadata
  severity: high
  confidence: high
  source_ref: 'Sources: spark.table(curated.transactions, accounts, customers, ref.high_risk_countries);
    spark.read.parquet(hdfs:///data/ref/fx_rates/)'
  evidence: No metadata snapshot supplied. Column types, partition specs, and nested
    field types beyond the source comments are unknown; source schema lists are empty.
  affected_refs:
  - src_transactions
  - src_accounts
  - src_customers
  - src_fx
  - src_hrc
  blocks:
  - generation
  - execution
  status: open
  resolution: Supply a metadata snapshot with column types, partition columns, and
    key information for each source and the target, then regenerate schema blocks.
  rule_ref: null
- id: F-004
  category: compatibility
  severity: high
  confidence: medium
  source_ref: 'T4 joins: account_id, customer_id, currency = fx_currency, cp_country
    = hr_country'
  evidence: Uniqueness of accounts.account_id, customers.customer_id, fx (currency,
    rate_date) and high_risk_countries.country is not verified. Non-unique keys would
    multiply transaction rows.
  affected_refs:
  - t04_enriched_join
  blocks:
  - execution
  status: open
  resolution: Verify key uniqueness against metadata or declare keys with an owner.
    Add a duplicate-key check to the validation plan.
  rule_ref: null
- id: F-005
  category: business_assumption
  severity: medium
  confidence: high
  source_ref: 'T4: inner joins to accounts and customers'
  evidence: Transactions without a matching account or customer are silently dropped.
    The source does not distinguish an absent account or customer from a data-quality
    issue.
  affected_refs:
  - t04_enriched_join
  blocks:
  - execution
  status: open
  resolution: Confirm inner-join drop behavior is intended and document drop counts
    as a reconciliation control.
  rule_ref: null
- id: F-006
  category: business_assumption
  severity: medium
  confidence: medium
  source_ref: 'T1: element_at(filter(addresses, a -> a.is_primary), 1)'
  evidence: Zero primary addresses yield NULL residence_country. Multiple primaries
    take the first element in array order, which is not specified. Absent addresses
    yield NULL address_countries and multi_country_flag behavior that depends on null
    size semantics.
  affected_refs:
  - t01_cust_profile
  - t14_customer_base
  blocks:
  - execution
  status: open
  resolution: Define primary-address tie rule and null-address handling. Distinguish
    absent address from missing customer in the output contract.
  rule_ref: null
- id: F-007
  category: privacy
  severity: high
  confidence: medium
  source_ref: 'Sources: curated.transactions (counterparty), curated.accounts (attributes),
    curated.customers (addresses); target risk.customer_daily_risk'
  evidence: Customer, account, and counterparty attributes plus AML flags and exposure
    data are processed and written. Classification is metadata-based and provisional;
    no handling policy was supplied.
  affected_refs:
  - src_transactions
  - src_accounts
  - src_customers
  - tgt_customer_daily_risk
  blocks:
  - execution
  status: open
  resolution: Provide an applicable data handling policy naming permitted destinations,
    access controls, logging restrictions, and required transformations. No masking
    has been applied.
  rule_ref: null
- id: F-008
  category: operational
  severity: high
  confidence: medium
  source_ref: 'TARGET: write.mode(''overwrite'').insertInto(''risk.customer_daily_risk'')
    with spark.sql.sources.partitionOverwriteMode=dynamic'
  evidence: Partition columns are not declared, so the overwrite scope is unknown.
    If no POSTED transactions exist for run_date, the outcome for existing partitions
    is undefined in this analysis. Dynamic mode replaces only partitions present in
    the output.
  affected_refs:
  - tgt_customer_daily_risk
  blocks:
  - execution
  status: open
  resolution: Declare target partition spec and the exact overwrite scope. Define
    empty-input behavior for run_date. No overwrite is permitted until bounded.
  rule_ref: null
- id: F-009
  category: compatibility
  severity: medium
  confidence: medium
  source_ref: 'T6: orderBy(txn_ts.cast(''long'')).rangeBetween(-3*86400, 0)'
  evidence: Frame is inclusive of the current row. RANGE includes all peers with the
    same ordering value. Casting timestamp to seconds truncates sub-second ordering,
    which can change which rows fall in the window.
  affected_refs:
  - t07_structuring_window
  blocks:
  - execution
  status: open
  resolution: Confirm the seconds-truncated ordering is intended. Verify the RANGE
    and cast behavior against version-matched Spark 3 documentation.
  rule_ref: null
- id: F-010
  category: compatibility
  severity: medium
  confidence: high
  source_ref: 'T9: F.map_from_entries(F.collect_list(F.struct(''currency'',''usd'')))'
  evidence: A NULL currency produces a NULL map key, which fails at runtime. The source
    has no handling for NULL currency.
  affected_refs:
  - t12_exposure_pairs
  - t13_exposure
  blocks:
  - execution
  status: open
  resolution: Declare NULL-currency policy (reject, bucket, or exclude) and add a
    null-key check.
  rule_ref: null
- id: F-011
  category: compatibility
  severity: medium
  confidence: medium
  source_ref: 'T5: F.round(amount * coalesce(usd_rate, 1.0), 2).cast(''double'')'
  evidence: Amount type is unknown. ROUND then CAST to DOUBLE drops DECIMAL intent.
    Thresholds 10000 and 8000 to 9999.99 are applied to double values, which may change
    boundary results for values near thresholds.
  affected_refs:
  - t05_amounts
  - t06_near_threshold
  blocks:
  - execution
  status: open
  resolution: Declare the source DECIMAL precision and target type. Preserve exact
    decimal arithmetic or get reviewer approval for double semantics.
  rule_ref: null
- id: F-012
  category: business_assumption
  severity: low
  confidence: high
  source_ref: 'summary: CASE WHEN size(risk_reasons) = 0 THEN 10'
  evidence: Customers with no fired rules receive risk_score 10 through a hard-coded
