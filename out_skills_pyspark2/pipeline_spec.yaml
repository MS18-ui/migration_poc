  affected_refs:
  - t15_summary
  blocks:
  - execution
  status: open
  resolution: Business owner to confirm the default score.
  rule_ref: null
- id: F-013
  category: compatibility
  severity: low
  confidence: medium
  source_ref: T1 size(address_countries); T5 and T9 boolean expressions
