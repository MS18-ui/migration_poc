job:
  name: pyspark2_daily_txn_risk
  domain: banking_aml
  use_case: Daily customer transaction risk and AML flags with nested types
  engine: pyspark
  engine_version: 2.4 source; target pyspark_3.x
  source_file: 'UNVERIFIED: path and hash not supplied in this run'
  parameters:
    run_date: '2026-10-18'
  spark_conf:
    spark.sql.sources.partitionOverwriteMode: dynamic
sources:
- id: src_transactions
  type: hive_table
  object: curated.transactions
  pre_filter: txn_date = :run_date
  schema: []
- id: src_accounts
  type: hive_table
  object: curated.accounts
  schema: []
- id: src_customers
  type: hive_table
  object: curated.customers
  schema: []
- id: src_fx
  type: parquet
  path: hdfs:///data/ref/fx_rates/
  pre_filter: rate_date = :run_date
  schema: []
- id: src_hrc
  type: hive_table
  object: ref.high_risk_countries
  schema: []
transformations:
- id: t01_cust_profile
  type: nested_derive
  inputs:
  - src_customers
  columns:
  - name: primary_address
    expr: element_at(filter(addresses, a -> a.is_primary), 1)
  - name: residence_country
    expr: primary_address.country
  - name: address_countries
    expr: array_distinct(transform(addresses, a -> a.country))
  - name: multi_country_flag
    expr: size(address_countries) > 1
  select:
  - customer_id
  - segment
  - residence_country
  - address_countries
  - multi_country_flag
  notes: Source T1. Zero primary addresses yield NULL residence_country; multiple
    primaries take the first in array order (unspecified). Absent addresses are distinct
    from a missing customer. size() on NULL addresses depends on Spark 3 legacy sizeOfNull
    setting; verify against version-matched docs.
- id: t02_acct_attrs
  type: nested_derive
  inputs:
  - src_accounts
  columns:
  - name: product_code
    expr: attributes['product_code']
  - name: overdraft_limit
    expr: CAST(attributes['overdraft_limit'] AS DOUBLE)
  - name: is_joint
    expr: attributes['joint_holder'] = 'Y'
  select:
  - account_id
  - customer_id
  - product_code
  - overdraft_limit
  - is_joint
  notes: Source T2. Missing map key returns NULL; invalid overdraft string cast to
    NULL silently. is_joint is NULL when key absent.
- id: t03_posted_txn
  type: filter_dedupe_flatten
  inputs:
  - src_transactions
  columns:
  - name: cp_name
    expr: counterparty.name
  - name: cp_bic
    expr: counterparty.bank_bic
  - name: cp_country
    expr: counterparty.country
  filter: status = 'POSTED'
  dedupe_keys:
  - txn_id
  notes: Source T3. dropDuplicates(txn_id) keeps an arbitrary row; a deterministic
    tie-breaker is required before execution (see F-002). counterparty.account_no
    is read by the schema but not used by the source; not carried forward (see F-017).
- id: t04_enriched_join
  type: join
  inputs:
  - t03_posted_txn
  - t02_acct_attrs
  - t01_cust_profile
  - src_fx
  - src_hrc
  joins:
  - left: t03_posted_txn
    right: t02_acct_attrs
    type: inner
    'on':
    - account_id
  - left: '*'
    right: t01_cust_profile
    type: inner
    'on':
    - customer_id
  - left: '*'
    right: src_fx
    type: left
    'on': currency = fx_currency
    hint: broadcast
  - left: '*'
    right: src_hrc
    type: left
    'on': cp_country = hr_country
    hint: broadcast
  notes: Source T4. Inner joins drop transactions lacking a matching account or customer.
    FX and high-risk joins are left joins; key uniqueness is unverified (see F-004).
- id: t05_amounts
  type: nested_derive
  inputs:
  - t04_enriched_join
  columns:
  - name: amount_usd
    expr: CAST(ROUND(amount * COALESCE(usd_rate, 1.0), 2) AS DOUBLE)
  - name: is_large_txn
    expr: amount_usd >= 10000
  - name: is_cash
    expr: txn_type IN ('CASH_DEP', 'CASH_WDL')
  - name: is_high_risk_cp
    expr: hr_country IS NOT NULL
  - name: is_cross_border
    expr: cp_country IS NOT NULL AND cp_country <> residence_country
  notes: Source T5. Missing FX falls back to rate 1.0 (business assumption, see F-001).
    ROUND then CAST to DOUBLE drops DECIMAL intent (see F-011). Threshold 10000 is
    inclusive.
- id: t06_near_threshold
  type: nested_derive
  inputs:
  - t05_amounts
  columns:
  - name: near_threshold
    expr: CASE WHEN is_cash AND amount_usd BETWEEN 8000 AND 9999.99 THEN 1 ELSE 0
      END
  notes: Source T6 flag. BETWEEN is inclusive at both bounds 8000 and 9999.99. NULL
    is_cash or amount yields 0.
- id: t07_structuring_window
  type: window
  inputs:
  - t06_near_threshold
  columns:
  - name: near_thr_cnt_3d
    expr: SUM(near_threshold)
  window:
    partition_by:
    - customer_id
    order_by:
    - CAST(txn_ts AS BIGINT)
    frame: RANGE BETWEEN 259200 PRECEDING AND CURRENT ROW
  notes: Source T6 window. Frame is 3*86400 seconds inclusive of the current row;
    RANGE includes all peers with equal ordering value. Timestamp cast to seconds
    truncates sub-second ordering (see F-009).
- id: t08_structuring_flag
  type: nested_derive
  inputs:
  - t07_structuring_window
  columns:
  - name: structuring_flag
    expr: near_thr_cnt_3d >= 3
- id: t09_rules
  type: nested_derive
  inputs:
  - t08_structuring_flag
  columns:
  - name: fired_raw
    expr: array(CASE WHEN structuring_flag THEN named_struct('rule_id', 'R01', 'description',
      'Cash structuring', 'score', 90) END, CASE WHEN is_high_risk_cp THEN named_struct('rule_id',
      'R02', 'description', 'High-risk counterparty country', 'score', 70) END, CASE
      WHEN is_large_txn THEN named_struct('rule_id', 'R03', 'description', 'Large
      transaction >= 10k USD', 'score', 40) END, CASE WHEN is_cross_border AND multi_country_flag
      THEN named_struct('rule_id', 'R04', 'description', 'Cross-border with multi-country
      profile', 'score', 30) END)
  - name: fired_rules
    expr: filter(fired_raw, r -> r IS NOT NULL)
  notes: Source T7. Rule scores 90, 70, 40, 30 preserved. NULL conditions do not fire.
    This transformation is the scored dataset used by T10 to T14.
- id: t10_rule_hits
  type: explode_aggregate
  inputs:
  - t09_rules
  group_by:
  - customer_id
  - r.rule_id AS rule_id
  aggregations:
  - name: hit_count
    expr: COUNT(txn_id)
  - name: total_amount_usd
    expr: SUM(amount_usd)
  - name: max_score
    expr: MAX(r.score)
  notes: 'Source T8. Explode is non-outer: transactions with no fired rules drop out
    here (intended per source; preserved). Group key rule_id is projected from the
    exploded struct.'
  explode:
    column: fired_rules
    alias: r
- id: t11_reasons
  type: aggregate
  inputs:
  - t10_rule_hits
  group_by:
  - customer_id
  aggregations:
  - name: risk_reasons
    expr: sort_array(collect_list(named_struct('rule_id', rule_id, 'hit_count', hit_count,
      'total_amount_usd', total_amount_usd, 'max_score', max_score)))
  notes: Source T8 collect. Output ARRAY<STRUCT<rule_id,hit_count,total_amount_usd,max_score>>
    is sorted by struct order. collect_list is unbounded per customer (see F-018).
- id: t12_exposure_pairs
  type: aggregate
  inputs:
  - t09_rules
  group_by:
  - customer_id
  - currency
  aggregations:
  - name: usd
    expr: SUM(amount_usd)
  notes: Source T9 first stage. NULL currency forms a NULL group (see F-010).
- id: t13_exposure
  type: aggregate
  inputs:
  - t12_exposure_pairs
  group_by:
  - customer_id
  aggregations:
  - name: exposure_by_currency
    expr: map_from_entries(collect_list(named_struct('currency', currency, 'usd',
      usd)))
  notes: Source T9 second stage. map_from_entries fails at runtime on a NULL key (see
    F-010). Output MAP<STRING,DOUBLE>.
- id: t14_customer_base
  type: aggregate
  inputs:
  - t09_rules
  group_by:
  - customer_id
  - segment
  - residence_country
  aggregations:
  - name: address_countries
    expr: FIRST(address_countries)
  - name: multi_country_flag
    expr: FIRST(multi_country_flag)
  - name: txn_count
    expr: COUNT(txn_id)
  - name: total_amount_usd
    expr: SUM(amount_usd)
  - name: large_txn_count
    expr: SUM(CASE WHEN is_large_txn THEN 1 ELSE 0 END)
  - name: structuring_flag
    expr: MAX(structuring_flag)
  - name: counterparty_countries
    expr: COLLECT_SET(cp_country)
  notes: Source T10. FIRST without ignoreNulls preserved. address_countries and multi_country_flag
    are constant per customer by construction.
- id: t15_summary
  type: join_derive
  inputs:
  - t14_customer_base
  - t11_reasons
  - t13_exposure
  columns:
  - name: risk_reasons
    expr: COALESCE(risk_reasons, CAST(array() AS ARRAY<STRUCT<rule_id:STRING,hit_count:BIGINT,total_amount_usd:DOUBLE,max_score:INT>>))
  - name: risk_score
    expr: CASE WHEN size(risk_reasons) = 0 THEN 10 ELSE array_max(transform(risk_reasons,
      r -> r.max_score)) END
  - name: run_date
    expr: :run_date
  joins:
  - left: t14_customer_base
    right: t11_reasons
    type: left
    'on':
    - customer_id
  - left: '*'
    right: t13_exposure
    type: left
    'on':
    - customer_id
  notes: 'Source summary. Customers with no fired rules get an empty reasons array
    and risk_score 10 (business assumption, see F-012). Columns evaluated in order:
    risk_reasons is coalesced before risk_score reads it.'
targets:
- id: tgt_customer_daily_risk
  input: t15_summary
  type: iceberg_table
  object: risk.customer_daily_risk
  format: UNRESOLVED
  mode: overwrite_dynamic_partition
  method: insertInto
  partition_by: []
  schema: []
  properties: {}
  notes: Source writes Hive table risk.customer_daily_risk with insertInto and overwrite
    mode under dynamic partition overwrite. Iceberg mapping, partition spec, and write
    scope are unresolved (see F-008, F-015). insertInto is positional; target column
    order must match the source select list. Target schema not supplied.
